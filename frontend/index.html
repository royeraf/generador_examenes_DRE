<!doctype html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <!-- Bloquea el zoom por gestos/pellizco y el zoom automático al enfocar inputs -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description"
    content="Generador de exámenes inteligente para la Dirección Regional de Educación Huánuco" />
  <title>Plataforma SIEVA - DREHCO</title>
  <script>
    // Remove dark mode if user prefers light
    (function () {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || (!theme && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>

<body class="bg-gray-50 dark:bg-slate-900">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
