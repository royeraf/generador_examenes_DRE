<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="520" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="60" y1="80" x2="320" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="pantsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rect (subtle) -->
  <rect width="520" height="400" fill="url(#bgGrad)" rx="24"/>

  <!-- Decorative circles -->
  <circle cx="460" cy="60" r="50" fill="#4f46e5" opacity="0.08"/>
  <circle cx="60" cy="340" r="40" fill="#14b8a6" opacity="0.10"/>
  <circle cx="490" cy="320" r="30" fill="#6366f1" opacity="0.08"/>
  <circle cx="30" cy="80" r="20" fill="#2dd4bf" opacity="0.12"/>

  <!-- Floating dots -->
  <circle cx="380" cy="30" r="5" fill="#5eead4" opacity="0.5"/>
  <circle cx="400" cy="55" r="3" fill="#818cf8" opacity="0.5"/>
  <circle cx="350" cy="50" r="4" fill="#2dd4bf" opacity="0.4"/>
  <circle cx="120" cy="370" r="4" fill="#818cf8" opacity="0.4"/>
  <circle cx="150" cy="350" r="3" fill="#5eead4" opacity="0.5"/>

  <!-- ===== WHITEBOARD ===== -->
  <rect x="55" y="55" width="270" height="185" rx="10" fill="url(#boardGrad)" filter="url(#shadow)"/>
  <!-- Board frame -->
  <rect x="55" y="55" width="270" height="185" rx="10" fill="none" stroke="#14b8a6" stroke-width="3" opacity="0.6"/>
  <!-- Board glare -->
  <rect x="65" y="65" width="80" height="20" rx="5" fill="white" opacity="0.04"/>

  <!-- Board content: lines (text simulation) -->
  <line x1="80" y1="110" x2="220" y2="110" stroke="#5eead4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="80" y1="130" x2="190" y2="130" stroke="#5eead4" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="150" x2="200" y2="150" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="170" x2="160" y2="170" stroke="#5eead4" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Board content: lightbulb icon -->
  <g transform="translate(235, 82)">
    <!-- bulb body -->
    <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z"
          fill="#fbbf24" opacity="0.9" transform="scale(1.3)"/>
    <!-- bulb base -->
    <rect x="8.5" y="18" width="7" height="2" rx="1" fill="#fbbf24" opacity="0.7" transform="scale(1.3)"/>
    <!-- shine -->
    <path d="M9 6C9.5 4.5 11 4 12 4" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6" transform="scale(1.3)"/>
  </g>

  <!-- Board stand / easel legs -->
  <line x1="190" y1="240" x2="170" y2="295" stroke="#134e4a" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="240" x2="210" y2="295" stroke="#134e4a" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="295" x2="225" y2="295" stroke="#134e4a" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== TEACHER ===== -->
  <!-- Shadow -->
  <ellipse cx="370" cy="358" rx="45" ry="10" fill="#1e1b4b" opacity="0.15"/>

  <!-- Legs / pants -->
  <rect x="340" y="285" width="22" height="70" rx="10" fill="url(#pantsGrad)"/>
  <rect x="368" y="285" width="22" height="70" rx="10" fill="url(#pantsGrad)"/>
  <!-- Shoes -->
  <ellipse cx="351" cy="356" rx="16" ry="7" fill="#312e81"/>
  <ellipse cx="379" cy="356" rx="16" ry="7" fill="#312e81"/>

  <!-- Body / shirt -->
  <rect x="330" y="200" width="70" height="95" rx="18" fill="url(#shirtGrad)"/>

  <!-- Collar / neck -->
  <rect x="357" y="190" width="16" height="20" rx="6" fill="#fde68a"/>

  <!-- Head -->
  <circle cx="365" cy="170" r="32" fill="#fde68a"/>
  <!-- Hair -->
  <path d="M336 158 Q345 128 365 130 Q385 128 394 158" fill="#1e1b4b" opacity="0.85"/>
  <!-- Eyes -->
  <ellipse cx="356" cy="168" rx="4" ry="4.5" fill="#1e1b4b"/>
  <ellipse cx="374" cy="168" rx="4" ry="4.5" fill="#1e1b4b"/>
  <!-- Eye shine -->
  <circle cx="358" cy="166" r="1.5" fill="white"/>
  <circle cx="376" cy="166" r="1.5" fill="white"/>
  <!-- Smile -->
  <path d="M356 180 Q365 188 374 180" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Ear -->
  <ellipse cx="334" cy="172" rx="6" ry="8" fill="#fde68a"/>
  <ellipse cx="396" cy="172" rx="6" ry="8" fill="#fde68a"/>

  <!-- Left arm: pointing at board -->
  <path d="M335 225 Q300 220 280 195" stroke="#14b8a6" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Hand -->
  <circle cx="278" cy="193" r="9" fill="#fde68a"/>
  <!-- Marker in hand -->
  <rect x="260" y="188" width="20" height="6" rx="3" fill="white" opacity="0.9" transform="rotate(-20, 270, 191)"/>

  <!-- Right arm: holding book -->
  <path d="M397 225 Q420 240 415 270" stroke="#14b8a6" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Book -->
  <rect x="408" y="265" width="38" height="50" rx="5" fill="#6366f1" filter="url(#shadow)"/>
  <rect x="414" y="270" width="26" height="3" rx="1.5" fill="white" opacity="0.5"/>
  <rect x="414" y="278" width="20" height="3" rx="1.5" fill="white" opacity="0.4"/>
  <rect x="414" y="286" width="23" height="3" rx="1.5" fill="white" opacity="0.3"/>
  <!-- Book spine -->
  <rect x="408" y="265" width="6" height="50" rx="3" fill="#4f46e5"/>

  <!-- ===== STUDENT DESKS (background) ===== -->
  <!-- Desk 1 -->
  <rect x="40" y="315" width="80" height="10" rx="5" fill="url(#deskGrad)" opacity="0.8"/>
  <rect x="55" y="325" width="8" height="30" rx="4" fill="#0d9488" opacity="0.6"/>
  <rect x="100" y="325" width="8" height="30" rx="4" fill="#0d9488" opacity="0.6"/>
  <!-- Student head 1 -->
  <circle cx="80" cy="298" r="16" fill="#fde68a" opacity="0.8"/>
  <path d="M65 292 Q72 276 80 278 Q88 276 95 292" fill="#92400e" opacity="0.7"/>

  <!-- Desk 2 -->
  <rect x="440" y="280" width="70" height="10" rx="5" fill="url(#deskGrad)" opacity="0.7"/>
  <rect x="452" y="290" width="7" height="28" rx="3.5" fill="#0d9488" opacity="0.5"/>
  <rect x="492" y="290" width="7" height="28" rx="3.5" fill="#0d9488" opacity="0.5"/>
  <!-- Student head 2 -->
  <circle cx="474" cy="262" r="14" fill="#fde68a" opacity="0.75"/>
  <path d="M461 256 Q468 242 474 244 Q480 242 487 256" fill="#1e1b4b" opacity="0.6"/>

  <!-- Floating AI sparkle elements -->
  <g transform="translate(430, 100)" opacity="0.85">
    <circle cx="0" cy="0" r="20" fill="#4f46e5" opacity="0.15"/>
    <circle cx="0" cy="0" r="13" fill="#4f46e5" opacity="0.2"/>
    <!-- Star / sparkle -->
    <path d="M0-10 L2.5-2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5-2.5 Z" fill="#818cf8"/>
  </g>
  <g transform="translate(455, 145)" opacity="0.7">
    <path d="M0-7 L1.7-1.7 L7 0 L1.7 1.7 L0 7 L-1.7 1.7 L-7 0 L-1.7-1.7 Z" fill="#5eead4"/>
  </g>
  <g transform="translate(415, 130)" opacity="0.6">
    <path d="M0-5 L1.3-1.3 L5 0 L1.3 1.3 L0 5 L-1.3 1.3 L-5 0 L-1.3-1.3 Z" fill="#a5b4fc"/>
  </g>

  <!-- Bottom label area -->
  <rect x="130" y="358" width="240" height="28" rx="14" fill="#0f172a" opacity="0.35"/>
  <text x="250" y="377" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="white" letter-spacing="2" opacity="0.9">SIEVA · IA Educativa</text>
</svg>
